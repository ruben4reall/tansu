name: Tansu
options:
  bundleIdPrefix: ch.rubencatalao
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
packages:
  TansuKit:
    path: Packages/TansuKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Tansu:
    type: application
    platform: macOS
    sources:
      - App
      # The Icon Composer document: Xcode 26 compiles it into Assets.car and Tansu.icns.
      - path: brand/Tansu.icon
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: TansuKit
        product: TansuApp
      - package: TansuKit
        product: TansuUI
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Tansu
        CFBundleDisplayName: Tansu
        CFBundleDevelopmentRegion: en
        # The languages of the String Catalog: macOS shows Tansu in the person's language, and Sparkle follows it.
        CFBundleLocalizations: [en, fr, de, it, es, pt-BR, nl, ja, ko, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        # A menu bar app: no Dock icon and no main menu until a window opens.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Ruben Catalao. MIT License. Tansu is not affiliated with Apple."
        # Updates: Sparkle 2. The welcome asks about automatic checks, so Sparkle never shows its own alert. The feed
        # and its release notes are signed, and disk images are checked before they are opened.
        SUFeedURL: https://gettansu.vercel.app/appcast.xml
        SUPublicEDKey: "Hw6FHVK3F5noWjlKinBYL+douzFTQ/EMm6J8pXIdTf0="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.tansu
        ASSETCATALOG_COMPILER_APPICON_NAME: Tansu
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Development builds keep their own preferences and Accessibility grant, apart from the installed app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.tansu.debug
