name: Bug report
description: Something does not work the way Tiroir says it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Tiroir did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Files & Cloud drawer
        2. Click Google Drive
  - type: input
    id: apps
    attributes:
      label: The apps whose icons are involved
      placeholder: Google Drive 110.0, Proton VPN 5.2
  - type: input
    id: mac
    attributes:
      label: Mac model and displays
      placeholder: MacBook Pro 14-inch, M3 Pro, 2023, with one external display
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5.2"
    validations:
      required: true
  - type: input
    id: tiroir
    attributes:
      label: Tiroir version (Settings, About)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: The engine Tiroir uses (Settings, Behavior)
      placeholder: macOS 26
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: |
        Tiroir logs numbers, states and bundle identifiers only, never a window title or an icon's label. Right after the problem, run this in Terminal and paste the output:
        /usr/bin/log show --last 5m --info --style compact --predicate 'subsystem == "ch.rubencatalao.tiroir"'
      render: text
